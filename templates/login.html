<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | WishVerse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<div class="login-container">

<div class="login-box">

<h2 class="logo">
✨ WishVerse
</h2>

<h4 class="heading">
Welcome Back
</h4>

<p class="sub-heading">
Login to continue creating beautiful greeting cards.
</p>

{% with messages = get_flashed_messages() %}
{% if messages %}

<div class="alert alert-danger">

{{ messages[0] }}

</div>

{% endif %}
{% endwith %}

<form method="POST">

<div class="mb-3">

<label class="form-label">

Email Address

</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter your password"
required>

</div>

<button
type="submit"
class="btn btn-primary w-100">

Login

</button>

</form>

<p class="register-text">

Don't have an account?

<a href="{{ url_for('register') }}">

Register

</a>

</p>

<a href="{{ url_for('home') }}"
class="back-home">

← Back to Home

</a>

</div>

</div>

</body>

</html>
